<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Article/Module Search & Transform</title>
    <link rel="icon" type="image/png" href="/static/img/jost_favicon.png">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div style="display:flex; justify-content:flex-end; align-items:center; margin-bottom:0.6em; gap:1em; flex-wrap:wrap;">
        <label for="languageSwitch" style="font-weight:600; margin-right:0.5em;">Language</label>
        <select id="languageSwitch" style="padding:4px 8px; border-radius:4px; border:1px solid #b6c6d6;">
            <option value="en" selected data-i18n="langEnglish">English</option>
            <option value="de" data-i18n="langGerman">Deutsch</option>
        </select>
    </div>
    <div style="display:flex; justify-content:center; align-items:center; gap:2em; margin-bottom:1.5em; flex-wrap:wrap;">
        <img src="/static/img/Jost.jpg" alt="Jost" style="height:64px; max-width:120px; object-fit:contain; background:#fff; border-radius:8px; box-shadow:0 2px 8px #0001; padding:4px;">
        <img src="/static/img/majesty.jpeg" alt="Majesty" style="height:64px; max-width:120px; object-fit:contain; background:#fff; border-radius:8px; box-shadow:0 2px 8px #0001; padding:4px;">
        <img src="/static/img/move_data.png" alt="Move_Data" style="height:64px; max-width:120px; object-fit:contain; background:#fff; border-radius:8px; box-shadow:0 2px 8px #0001; padding:4px;">
        <img src="/static/img/iFAS.webp" alt="iFAS" style="height:64px; max-width:120px; object-fit:contain; background:#fff; border-radius:8px; box-shadow:0 2px 8px #0001; padding:4px;">
    </div>
    <div class="tabs">
        <button id="tabSearchBtn" class="tablink" onclick="openTab(event, 'searchTab')">Search & Transform</button>
        <button class="tablink" onclick="openTab(event, 'createTab')">Create new article/module</button>
        <button class="tablink" onclick="openTab(event, 'settingsTab')" id="defaultTab">Settings</button>
        <div id="createTab" class="tabcontent" style="display:none;">
            <div style="margin:2em 0; display:flex; flex-direction:column; align-items:center; gap:1.5em;">
                <button id="createRootArticleBtn" type="button" class="modern-btn" style="min-width:200px;">Create root article</button>
                <div id="rootArticleFormContainer" style="width:100%; max-width:600px; display:none;"></div>
                <div id="moduleWorkflowContainer" style="width:100%; max-width:600px; display:none;"></div>
            </div>
        </div>
    </div>
    <div id="searchTab" class="tabcontent" style="display:none;">
        <div style="display:flex; align-items:center; gap:1.5em; margin-bottom:0.5em;">
            <button type="button" id="toggleModeBtn" class="modern-btn" style="display:flex;align-items:center;gap:0.7em;min-width:180px;justify-content:center;">
                <span id="modeSwitchIcon" style="font-size:1.3em;">↔️</span>
                <span style="font-size:1em; font-weight:500; margin-left:0.3em;" data-i18n="changeMode">Change Mode</span>
            </button>
            <span id="searchModeLabel" class="mode-pill mode-article">
                <span id="modePillIcon" style="font-size:1.2em;vertical-align:middle;">🔎</span>
                <span id="modePillText" style="margin-left:0.5em;vertical-align:middle;">Article</span>
            </span>
        </div>
        <!-- General search form for both modes -->
        <form id="searchForm" style="display:flex; align-items:center; gap:0.7em; margin: 1.2em 0 0.7em 0; max-width:520px;">
                <input type="text" id="searchInput" name="query" placeholder="Search by Artikelnummer, Zeichnungsnummer or description" style="flex:1; min-width:0; padding:10px 14px; font-size:15px; border:1.5px solid #b6c6d6; border-radius:6px; outline:none;">
                <button id="searchSubmitBtn" type="submit" class="modern-btn" style="min-width:100px; min-height:36px; padding:8px 0; margin:0;" data-i18n="searchButton"></button>
        </form>
        <!-- Article mode: Add articles, list, generate, download -->
        <div id="articleModeContainer" style="display:none; flex-direction:column; gap:1em; margin:1.5em 0 1.5em 0; max-width:520px;">
            <div style="display:flex; gap:0.7em; flex-wrap:wrap;">
                <button id="addArticleBtn" type="button" class="modern-btn" style="flex:1 1 180px; min-width:140px;" data-i18n="addArticle"></button>
                <button id="generateArticleDataBtn" type="button" class="modern-btn" style="flex:1 1 180px; min-width:140px;" data-i18n="generateData"></button>
                <button id="downloadArticleExcelBtn" type="button" class="modern-btn" style="flex:1 1 180px; min-width:140px;" data-i18n="downloadArticleImport"></button>
                <button id="downloadDocsXlsxBtn" type="button" class="modern-btn" style="flex:1 1 180px; min-width:140px;">Download Documents XLSX</button>
                <button id="downloadArticlePartlistBtn" type="button" class="modern-btn" style="flex:1 1 180px; min-width:140px;" data-i18n="downloadPartlistImport"></button>
                <button id="downloadArticlePartlistTreeBtn" type="button" class="modern-btn" style="flex:1 1 180px; min-width:140px;" data-i18n="downloadPartlistTree"></button>
            </div>
            <div style="margin-top:1em; display:flex; gap:0.7em;">
                <button id="resetArticleListBtn" type="button" class="modern-btn secondary" style="min-width:180px;" data-i18n="resetArticleList">Reset Article List</button>
                <button id="refreshArticleListPreviewBtn" type="button" class="modern-btn" style="min-width:120px;" data-i18n="refreshPreview">Refresh Preview</button>
            </div>
            <div id="articleListPreviewContainer" style="margin-top:1em; background:#f9f9f9; border:1px solid #ccc; border-radius:6px; padding:1em;">
                <div style="font-weight:600; margin-bottom:0.5em;" data-i18n="articleListPreview">Article List Preview</div>
                <table id="articleListPreviewTable" style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr><th>artnr</th><th>artbez1</th><th>zeichnr</th><th>Remove</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <!-- Module mode: all module-related buttons -->
        <div id="moduleModeContainer" style="display:none; flex-wrap:wrap; gap:0.7em; margin:1.5em 0 1.5em 0; max-width:520px;">
            <button id="generateModuleBtn" type="button" class="modern-btn" style="flex:1 1 180px; min-width:140px;" data-i18n="generateModule"></button>
            <button id="generateModuleDataBtn" type="button" class="modern-btn" style="flex:1 1 180px; min-width:140px;" data-i18n="generateModuleData"></button>
            <button id="downloadDocsXlsxBtn" type="button" class="modern-btn" style="flex:1 1 180px; min-width:140px;">Download Documents XLSX</button>
            <button id="downloadModuleExcelBtn" type="button" class="modern-btn" style="flex:1 1 180px; min-width:140px;" data-i18n="downloadModuleExcel"></button>
            <button id="downloadPartlistExcelBtn" type="button" class="modern-btn" style="flex:1 1 180px; min-width:140px;" data-i18n="downloadPartlistExcel"></button>
            <button id="downloadPartlistTreeBtn" type="button" class="modern-btn" style="flex:1 1 180px; min-width:140px;" data-i18n="downloadPartlistTree"></button>
        </div>
        <!-- Upload Existing Partlist moved to settings tab -->
        <!-- Removed: <button id="transformBtn" style="display:none;">Transform to iFAS Format</button> -->
        <div class="current-selection-container">
            <div id="currentSelectionLabel" class="current-selection-label" data-i18n="currentSelection"></div>
            <div class="current-selection-box">
                <textarea id="currentSelection" rows="2" readonly></textarea>
            </div>
        </div>
        <!-- Feedback log area moved here -->
        <div id="feedbackLog" style="margin-top:1em; background:#f1f1f1; padding:1em; border-radius:5px; min-height:2em; max-height:200px; overflow-y:auto;"></div>
        <div style="margin-top:1.2em; margin-bottom:1em;">
            <button id="validateArtikelBezeichnungenBtn" type="button" class="modern-btn" style="min-width:240px;" data-i18n="validateArtikelBezeichnungen">Validate Artikelbezeichnungen</button>
        </div>
        <div id="blockedArticlesContainer" style="display:none; margin-top:1em;">
            <button id="showBlockedArticlesBtn" type="button" class="modern-btn" style="margin-bottom:0.5em;" data-i18n="showBlockedArticles">Show Blocked Articles</button>
            <textarea id="blockedArticlesArea" rows="8" readonly style="width:100%; display:none; font-family:monospace;"></textarea>
        </div>

        <div id="blockedReplacementModal" class="blocked-modal-overlay" style="display:none;">
            <div class="blocked-modal-dialog">
                <h3 id="blockedModalTitle" style="margin-top:0;" data-i18n="modalTitle">Blocked Article Replacement</h3>
                <div id="blockedModalDetails" class="blocked-modal-details"></div>
                <div style="margin-top:0.8em;">
                    <label for="blockedSearchInput" style="display:block; font-weight:600; margin-bottom:0.35em;" data-i18n="modalSearchLabel">Search replacement</label>
                    <div style="display:flex; gap:0.5em; flex-wrap:wrap;">
                        <input id="blockedSearchInput" type="text" placeholder="Search by artnr / zeichnr / text" style="flex:1; min-width:220px; padding:8px 10px; border:1px solid #b6c6d6; border-radius:5px;" />
                        <button id="blockedSearchBtn" type="button" class="modern-btn" style="min-width:110px; margin:0;" data-i18n="modalSearch">Search</button>
                    </div>
                    <div id="blockedSearchResults" class="blocked-search-results"></div>
                </div>
                <div style="margin-top:0.8em;">
                    <label for="blockedReplacementArtnr" style="display:block; font-weight:600; margin-bottom:0.35em;" data-i18n="modalReplacementLabel">Replacement artnr</label>
                    <input id="blockedReplacementArtnr" type="text" placeholder="Enter replacement artnr" style="width:100%; padding:8px 10px; border:1px solid #b6c6d6; border-radius:5px;" data-i18n-placeholder="modalReplacementPlaceholder" />
                </div>
                <div style="display:flex; gap:0.6em; justify-content:flex-end; margin-top:1em; flex-wrap:wrap;">
                    <button id="blockedTextBtn" type="button" class="modern-btn tertiary" style="min-width:180px; margin:0;" data-i18n="modalTextBtn">Als Angebotsartikel definieren</button>
                    <button id="blockedIgnoreBtn" type="button" class="modern-btn secondary" style="min-width:130px; margin:0;" data-i18n="modalIgnore">Ignore</button>
                    <button id="blockedConfirmBtn" type="button" class="modern-btn" style="min-width:130px; margin:0;" data-i18n="modalConfirm">Confirm</button>
                </div>
            </div>
        </div>
    </div>
    <div id="settingsTab" class="tabcontent">
        <h2 id="settingsHeading" data-i18n="settingsHeading">Settings</h2>
        <form id="uploadForm" enctype="multipart/form-data" style="margin-bottom:1em;">
            <label data-i18n="uploadIfas">Upload iFAS Artikelstamm:</label>
            <input type="file" name="file" id="fileInput" style="margin-bottom:0.5em; display:inline-block;">
            <label style="margin-left:0.7em;" data-i18n="updateTarget">Update Target:</label>
            <select id="uploadTargetEnv" name="target_env">
                <option value="test" selected>TEST</option>
                <option value="prod">PROD</option>
            </select>
            <button type="submit" class="modern-btn" style="min-width:120px; min-height:40px; padding:10px 0; margin:0;" data-i18n="uploadButton">Upload</button>
        </form>
        <div id="uploadStatus"></div>

        <form id="uploadExistingPartlistForm" style="margin-top:1em; margin-bottom:1em; display:flex; gap:0.7em; align-items:center; flex-wrap:wrap;" enctype="multipart/form-data">
            <label for="existingPartlistFile" style="font-weight:500;">Upload Existing Partlist:</label>
            <input type="file" id="existingPartlistFile" name="existing_partlist_file" accept=".csv" style="min-width:180px;">
            <select id="existingPartlistEnv" name="partlist_env" style="padding:4px 8px; border-radius:4px; border:1px solid #b6c6d6;">
                <option value="TEST">Test</option>
                <option value="PROD">Prod</option>
            </select>
            <button type="submit" class="modern-btn" style="min-width:180px; margin:0;">Upload Existing Partlist</button>
        </form>
        <div id="existingPartlistUploadStatus" style="margin-bottom:1em;"></div>

        <div style="margin-bottom:1.5em; padding:0.6em; background:#f7f7f7; border:1px solid #ddd; border-radius:6px; max-width:520px;">
            <div style="font-weight:bold; margin-bottom:0.35em;" data-i18n="existingArticleTarget">Existing Articles Target</div>
            <label style="display:block; margin-bottom:0.2em;">
                <input type="radio" id="existingArticlesNone" name="existingArticlesTarget" value="none" checked>
                <span data-i18n="none">None</span>
            </label>
            <label style="display:block; margin-bottom:0.2em;">
                <input type="radio" id="existingArticlesProd" name="existingArticlesTarget" value="prod">
                <span data-i18n="addToProd">Add to PROD existing list</span>
            </label>
            <label style="display:block;">
                <input type="radio" id="existingArticlesTest" name="existingArticlesTarget" value="test">
                <span data-i18n="addToTest">Add to TEST existing list</span>
            </label>
        </div>
        <div style="margin-top:2em; margin-bottom:1em;">
            <form id="updateMajestyForm" style="display:inline-block; margin-right:1em;">
                <button type="submit" class="modern-btn" style="min-width:180px; min-height:40px;" data-i18n="updateMajesty"></button>
            </form>
            <form id="hardUpdateMajestyForm" style="display:inline-block;">
                <button type="submit" class="modern-btn" style="min-width:180px; min-height:40px; background:#e55; color:#fff;" data-i18n="hardUpdateMajesty"></button>
            </form>
            <span id="updateMajestyStatus" style="margin-left:1em; font-weight:500;"></span>
        </div>
        <div style="margin:1em 0; padding:0.6em; background:#f7f7f7; border:1px solid #ddd; border-radius:6px; max-width:520px;">
            <label style="display:flex; align-items:center; gap:0.6em; font-weight:500;">
                <input type="checkbox" id="bezeichnungenAnpassenToggle" />
                <span data-i18n="bezeichnungenAnpassen">Bezeichnungen Anpassen</span>
            </label>
        </div>
        <h3 data-i18n="activeSheets">Active Sheets</h3>
        <form id="sheetsForm">
            <div id="sheetsCheckboxes"></div>
        </form>

        <!-- Article Number Generation Form -->
        <div style="margin-top:2em; margin-bottom:1em; padding:1em; background:#f0f8ff; border:1px solid #b6c6d6; border-radius:6px; max-width:520px;">
            <h3 style="margin-top:0; color:#2980b9;">Generate Article Number</h3>
            <label for="numberPrefix" style="display:block; font-weight:500; margin-bottom:0.5em;">Number Prefix (optional):</label>
            <input id="numberPrefix" type="text" placeholder="Examples: 10 or 10.20 or 10.20.5678" style="width:90%; padding:6px; margin-bottom:0.7em; border:1px solid #b6c6d6; border-radius:4px;">
            <button id="generateNumberBtn" class="modern-btn" type="button" style="min-width:150px; margin-bottom:0.5em;">Generate Number</button>
            <div id="numberGenerationStatus" style="margin-bottom:0.5em; font-weight:500; min-height:20px;"></div>
            <label for="generatedNumber" style="display:block; font-weight:500; margin-bottom:0.3em;">Generated Number:</label>
            <input id="generatedNumber" type="text" readonly placeholder="Generated number will appear here" style="width:90%; padding:6px; background:#f9f9f9; border:1px solid #ddd; border-radius:4px;">
        </div>
        <!-- End Article Number Generation Form -->
        <!-- Add more settings controls here -->
    </div>

    <div id="validationModal" class="validation-modal-overlay" style="display:none;">
        <div class="validation-modal-dialog">
            <h3 id="validationModalTitle" style="margin-top:0;" data-i18n="validationModalTitle">Validate Artikelbezeichnungen</h3>
            <div id="validationModalMeta" class="validation-modal-meta"></div>
            <div class="validation-modal-grid">
                <div class="validation-modal-field">
                    <label for="validationArtnr">Artikelnummer</label>
                    <input id="validationArtnr" type="text" readonly />
                </div>
                <div class="validation-modal-field">
                    <label for="validationBezeichnung1">Bezeichnung 1 [de]</label>
                    <input id="validationBezeichnung1" type="text" />
                </div>
                <div class="validation-modal-field">
                    <label for="validationBezeichnung2">Bezeichnung 2 [de]</label>
                    <input id="validationBezeichnung2" type="text" />
                </div>
                <div class="validation-modal-field">
                    <label for="validationLieferantBezeichnung">Artikelbezeichnung Lieferant</label>
                    <input id="validationLieferantBezeichnung" type="text" />
                </div>
                <div class="validation-modal-field">
                    <label for="validationLieferantZusatz">Artikel-Zusatz-Bezeichnung Lieferant</label>
                    <input id="validationLieferantZusatz" type="text" />
                </div>
                <div class="validation-modal-field">
                    <label for="validationArtbez1">artbez1</label>
                    <input id="validationArtbez1" type="text" />
                </div>
                <div class="validation-modal-field">
                    <label for="validationArtbez2">artbez2</label>
                    <input id="validationArtbez2" type="text" />
                </div>
                <div class="validation-modal-field">
                    <label for="validationArtbez3">artbez3</label>
                    <input id="validationArtbez3" type="text" />
                </div>
                <div class="validation-modal-field">
                    <label for="validationArtbezMem">artbezmem</label>
                    <input id="validationArtbezMem" type="text" />
                </div>
            </div>
            <div id="validationStatus" class="validation-modal-status"></div>
            <div style="display:flex; gap:0.6em; justify-content:flex-end; margin-top:1em; flex-wrap:wrap;">
                <button id="validationCloseBtn" type="button" class="modern-btn secondary" style="min-width:130px; margin:0;" data-i18n="validationClose">Close</button>
                <button id="validationConfirmBtn" type="button" class="modern-btn" style="min-width:130px; margin:0;" data-i18n="validationConfirm">Confirm</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
